[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-reranking"
version = "0.1.0"
description = "Retrieval, reasoning, and evidence-availability controls for LLM reranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
inference = ["torch", "transformers", "accelerate", "sentence-transformers"]
qwen = ["vllm"]

[tool.setuptools.packages.find]
include = ["rerank", "experiments", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model_assets: requires pretrained tokenizers or encoder weights"]
